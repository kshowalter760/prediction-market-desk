
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-markets-desk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx", "websockets>=14,<17"
]

[project.optional-dependencies]
dev = ["pytest"]
dashboard = [
    "streamlit>=1.40",
    "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

